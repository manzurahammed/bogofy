name: CI

on:
  push:
    branches: [main, master, develop, release]
  pull_request:
    branches: [main, master, develop, release]

jobs:
  # PHP: syntax check, PHPCS, PHPUnit (PHP 8.0 + WordPress latest)
  php:
    name: PHP 8.0 - WP latest
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, intl, mysqli
          coverage: none
          tools: composer:v2

      - name: PHP syntax check (lint)
        run: |
          find . \( -path ./vendor -o -path ./node_modules \) -prune -o \
            -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP CodeSniffer (PHPCS)
        run: composer run-script phpcs

      - name: Install Subversion (needed to fetch the WP test suite)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup WordPress test environment
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Run PHPUnit tests
        run: composer run-script test

  # JavaScript: ESLint + React UI tests (Jest)
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests (React UI)
        run: npm test -- --passWithNoTests
