name: Build release zip

# Builds a WordPress.org-ready zip (honoring .distignore) and uploads it as an
# artifact. On a version tag (v1.0.0) it also attaches the zip to a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build admin assets
        run: |
          npm ci
          npm run build

      - name: Build release zip
        run: bash bin/build-release.sh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: buy-one-get-one
          path: buy-one-get-one.zip

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: buy-one-get-one.zip
